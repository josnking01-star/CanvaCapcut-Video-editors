name: Build Windows Native Desktop EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows x64 Executable (.exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Run Quality Verification Tests
        run: |
          npm run test

      - name: Compile Client & Full-Stack Engine
        run: |
          npm run build

      - name: Install Electron & Packaging Suite
        run: |
          npm install --save-dev electron electron-builder --legacy-peer-deps

      - name: Package Windows x64 Native Installer & Portable EXE
        run: |
          npx electron-builder --windows --x64 -c.win.target=nsis,portable -c.extraMetadata.main=electron/main.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Prepare Standalone Windows Release Bundle
        run: |
          mkdir -p release-builds
          if [ -d "dist_electron" ]; then
            cp -r dist_electron/*.exe release-builds/ 2>/dev/null || true
          fi
          
          # Prepare Portable Execution Bundle
          mkdir -p release-builds/OmniCutStudioElite_Portable
          cp -r dist release-builds/OmniCutStudioElite_Portable/
          cp -r node_modules release-builds/OmniCutStudioElite_Portable/ 2>/dev/null || true
          cp package.json server.ts tsconfig.json release-builds/OmniCutStudioElite_Portable/
          
          # Windows double-click launcher
          cat << 'EOF' > release-builds/OmniCutStudioElite_Portable/Launch_OmniCut_Studio.bat
          @echo off
          title OmniCut Studio Elite v3.0
          echo ========================================================
          echo   Starting OmniCut Studio Elite Desktop Engine...
          echo ========================================================
          cd /d "%~dp0"
          start http://localhost:3000
          call npx tsx server.ts
          pause
          EOF

          # Compress portable release bundle
          cd release-builds
          powershell -Command "Compress-Archive -Path OmniCutStudioElite_Portable -DestinationPath OmniCutStudioElite_Windows_v3.0_Portable.zip -Force"
          cd ..

      - name: Upload Windows Executable & Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OmniCutStudioElite_Windows_Binaries
          path: |
            dist_electron/*.exe
            release-builds/*.zip
            release-builds/*.exe
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: OmniCut Studio Elite v3.0.0 Windows Release
          body: |
            ## OmniCut Studio Elite v3.0.0 - Windows Desktop Native Release
            
            ### Included Deliverables:
            - **Windows Setup Installer (.exe)**: One-click NSIS setup for Windows 10 & 11 (64-bit).
            - **Portable Windows Package (.zip)**: Zero-install portable bundle with double-click launcher.
            - **Canva Graphic Editor & CapCut Multi-Track Timeline**.
            - **Google Flow Generative Media Studio & 15-Day Freshness Vault**.
            - **Part 11 Price Lock & Grandfathering Protection**.
            - **Master Owner Administration Suite (josnking01@gmail.com)**.
          files: |
            dist_electron/*.exe
            release-builds/*.zip
            release-builds/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
